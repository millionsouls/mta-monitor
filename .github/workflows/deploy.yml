name: Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SEVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          script: |
            cd /opt/mta-monitor
            ./deploy.sh
