<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MTA Train Monitor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/map.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/details.css') }}">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
        <div class="app-container">
            <div class="header">
                <div>
                    <div class="title">MTA Train Monitor</div>
                    <div id="last-updated">Updated: N/A</div>
                </div>
                <div id="controls">
                    <div class="controls">
                    <select id="mode" onchange="toggleLineInput()">
                                <option value="subway">Subway</option>
                                <option value="lirr">LIRR</option>
                        </select>
                    <input id="search-input" type="search" placeholder="Search trips, stops or IDs" oninput="onSearchInput()" style="min-width:180px" />
                    <button id="sort-arrival" title="Sort by arrival time" onclick="toggleSort()">Sort: Arrival ↓</button>
                        <span id="subway-line-span">
                                <select id="line">
                                        <option value="ALL">All</option>
                                        <option value="A">A</option>
                                        <option value="B">B</option>
                                        <option value="C">C</option>
                                        <option value="D">D</option>
                                        <option value="E">E</option>
                                        <option value="F">F</option>
                                        <option value="G">G</option>
                                        <option value="J">J</option>
                                        <option value="L">L</option>
                                        <option value="M">M</option>
                                        <option value="N">N</option>
                                        <option value="Q">Q</option>
                                        <option value="R">R</option>
                                        <option value="S">S</option>
                                        <option value="Z">Z</option>
                                        <option value="1">1</option>
                                        <option value="2">2</option>
                                        <option value="3">3</option>
                                        <option value="4">4</option>
                                        <option value="5">5</option>
                                        <option value="6">6</option>
                                        <option value="7">7</option>
                                </select>
                        </span>
                        <button onclick="loadTrains()">Monitor</button>
                        <button id="clear-tracked" class="secondary" onclick="clearTrackedTrain()" disabled>Clear tracked train</button>
                    </div>
                </div>
            </div>

            <div class="card" style="margin-top:12px;padding:0;">
                <div id="map" style="height:420px;border-radius:12px 12px 0 0;overflow:hidden"></div>
            </div>

            <div class="card">
                <div id="alert"></div>
                <table id="train-table">
                        <thead id="table-head"></thead>
                        <tbody id="table-body"></tbody>
                </table>
            </div>
        </div>

    <!-- Schedule Modal -->
    <div id="schedule-modal" style="display:none;">
        <header>
            <h2>Train Schedule</h2>
        </header>
        <table id="schedule-table">
            <thead>
                <tr>
                    <th>Sequence</th>
                    <th>Stop ID</th>
                    <th>Stop Name</th>
                    <th>Scheduled</th>
                    <th>Arrival</th>
                    <th>Arr. Delay</th>
                    <th>Departure</th>
                    <th>Dep. Delay</th>
                    <th>Track</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
        <footer>
            <button onclick="closeSchedule()">Close</button>
        </footer>
    </div>
    <div id="modal-backdrop" style="display:none;" onclick="closeSchedule()"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="{{ url_for('static', filename='main.js') }}"></script>
</body>
</html>
