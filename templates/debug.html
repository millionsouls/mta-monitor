<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Cache Debug</title>
  <style>body{font-family:Helvetica,Arial;margin:16px}pre{background:#f6f6f6;padding:12px;border-radius:6px}</style>
</head>
<body>
  <h1>Realtime Cache Debug</h1>
  <div id="info">Connecting...</div>
  <h2>State</h2>
  <pre id="state">-</pre>
  <h2>Logs</h2>
  <pre id="logs">-</pre>
<script>
  const stateEl = document.getElementById('state');
  const logsEl = document.getElementById('logs');
  function fetchState(){
    fetch('/debug/cache')
      .then(r=>r.json())
      .then(data=>{
        stateEl.textContent = JSON.stringify(data, null, 2);
        if (data.logs) {
          logsEl.textContent = data.logs.map(l=>new Date(l.ts*1000).toISOString()+" - "+l.msg).join('\n');
        }
      }).catch(e=>{ stateEl.textContent = 'error: '+e; });
  }
  fetchState();
  const es = new EventSource('/events');
  es.onmessage = (e)=>{
    try{ const d = JSON.parse(e.data); console.debug('event', d); }catch(err){}
    fetchState();
  }
  es.onerror = ()=>{ document.getElementById('info').textContent = 'Connection lost'; }
</script>
</body>
</html>
